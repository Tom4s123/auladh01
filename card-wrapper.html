<html>
<style>
.card-wrapper {
    container-name: card;
    container-type: inline-size;
}

.card {
    display: flex;
    flex-direction: column;
}

@container card (width >= 500px) {
    .card {
    flex-direction: row;
}
.card img {
width: 40%;
}
}
</style>
<body>
    <div class="card-wrapper">
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="Placeholder Image">
            <div class="card-content">
                <h2>Card Title</h2>
                <p>This is some content inside the card. Resize the window to see how the layout changes based on the container's width.</p>
            </div>
        </div>
    </div>
</body>
</html>
