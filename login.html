<html>
    <head>
        <title>HD2021</title>
    </head>
    <body>
        <header>
            <h1>Inscrição no Clube de Fotografia</h1>
            <nav>
                <a href="sobremim.html">Sobre mim</a>
            </nav>
        </header>
        <h1>Inscrição</h1>
        <p>Os campos obrigatórios estão assinalados com (obrigatório)</p>
        <body>           
        <main>

            <form action="#" method="post" >

            <!--Todo 3-->
            <label for="nome">Nome (obrigatório)</label>
            <input type="text" id="nome" name="nome" autocomplete="name" required/>
            <!--Todo 4-->
            <label for="email">Email (obrigatório)</label>
            <input type="email" id="email" name="email" autocomplete="email" required/>
            <!--Todo 5-->
            <label for="tel">Telemóvel</label>
            <input type="tel" id="tel" name="email" autocomplete="tel" />
            <!--Todo 6-->
            <label for="curso">Curso</label>
            <select id="curso" name="curso" required>
                <option value="">Escolhe o teu curso</option>
                <option value="curso1">Curso 1</option>
                <option value="curso2">Curso 2</option>
                <option value="curso3">Curso 3</option>
                <option value="curso4">Curso 4</option>
            </select>
            <!--Todo 7-->
            <fieldset>
                <legend>Ano</legend>          
                <input type="radio" id="ano1" name="ano" value="1">
                <label for="ano1">1.º</label>
                <br/>
                <input type="radio" id="ano2" name="ano" value="2">
                <label for="ano2">2.º</label>
                <br/>
                <input type="radio" id="ano3" name="ano" value="3">
                <label for="ano3">3.º</label> 
            </fieldset>
            <!--Todo 8-->
            <fieldset>
                <legend>Interesses</legend>
                <input type="checkbox" id="interesse1" name="interesses" value="retrato">
                <label for="interesse1">Retrato</label>
                <br/>
                <input type="checkbox" id="interesse2" name="interesses" value="paisagem">
                <label for="interesse2">Paisagem</label>
                <br/>
                <input type="checkbox" id="interesse3" name="interesses" value="rua">
                <label for="interesse3">Rua</label>
                <br/>
                <input type="checkbox" id="interesse4" name="interesses" value="edicao">
                <label for="interesse4">Edição</label>
            </fieldset>
            <!--Todo 9-->
            <textarea id="porque" name="porque" aria-describedby="ajuda" placeholder="Porque queres entrar no clube?"></textarea>
            <!--Todo 10-->
            <input type="checkbox" id="consentimento" name="consentimento" required>
            <label for="consentimento">Autorizo o uso dos meus dados apenas para gerir a inscrição</label>
            <!--Todo 11-->
            <button type="submit">Enviar Inscrição</button>
            </form>
        </main>

  <!-- TODO 12 -->
<footer>
    <p>Contacto: <a href="mailto:elbteles@hotmail.com">Enviar contacto</a></p>
</footer>


</body>
</html>
